[package]
name = "tauri-plugin-ship"
version = "0.1.0"
edition = "2021"
description = "Background update checks, downloads and one-click install for Tauri 2 apps on Windows"
license = "MIT"
publish = false
links = "tauri-plugin-ship"

[dependencies]
tauri = "2"
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
